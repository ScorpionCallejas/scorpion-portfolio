services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: scorpion-portfolio-web
    container_name: scorpion_web
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - scorpion-portfolio_proxy
    ports:
      - "3000:3000"

networks:
  scorpion-portfolio_proxy:
    external: true
